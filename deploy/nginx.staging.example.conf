# Example reverse proxy for on-prem staging (adjust hostnames, TLS certs, and paths).
# NOT deployed by this repository — IT installs on company LAN per D17.

upstream itdms_api {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream itdms_web {
    server 127.0.0.1:3011;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name itdms-staging.internal.example;

    # ssl_certificate     /etc/ssl/itdms-staging/fullchain.pem;
    # ssl_certificate_key /etc/ssl/itdms-staging/privkey.pem;

    client_max_body_size 12m;

    location /api/v1/ {
        proxy_pass http://itdms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://itdms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API env when behind this proxy:
#   ITDMS_TRUST_PROXY=1
#   NODE_ENV=production
#   ITDMS_STAGING_STRICT=1
#   CORS_ORIGIN=https://itdms-staging.internal.example  (if browser talks to API directly — prefer same-origin via Next proxy)
